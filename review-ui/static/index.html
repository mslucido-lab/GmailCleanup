<!doctype html><html lang="en"><meta charset="utf-8"><title>Gmail Cleanup</title><meta name="viewport" content="width=device-width,initial-scale=1"><style>body{font:14px system-ui;margin:40px;background:#faf9f5;color:#1f1e1d}main{max-width:1000px;margin:auto}.row{background:#fff;border:1px solid #ddd;padding:16px;margin:8px 0;border-radius:8px}button{padding:7px 11px}small{color:#666}</style><main><h1>Gmail Cleanup</h1><p>Review sender groups before any archive action.</p><div id="groups"></div></main><script>
async function load(){const groups=await fetch('/api/groups').then(r=>r.json());document.querySelector('#groups').innerHTML=groups.map(g=>`<article class=row><b>${g.group_key}</b><br><small>${g.category} · ${g.message_count} messages · ${(g.total_size_bytes/1e9).toFixed(2)} GB · score ${g.delete_safety_score.toFixed(1)}</small><p>${g.category==='Business-critical'?'Protected':`<button onclick="decide('${g.group_key}','approved')">Approve</button> <button onclick="decide('${g.group_key}','skipped')">Skip</button>`}</p></article>`).join('')||'<p>No scored groups yet.</p>'}async function decide(key,status){const r=await fetch(`/api/groups/${encodeURIComponent(key)}/decision`,{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({status})});if(!r.ok)alert(await r.text());load()}load()
</script></html>
