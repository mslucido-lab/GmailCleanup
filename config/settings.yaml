# Shared Gmail Cleanup settings. Secrets belong in environment variables.
CONSUMER_DOMAINS:
  - gmail.com
  - googlemail.com
  - yahoo.com
  - outlook.com
  - hotmail.com
  - live.com
  - msn.com
  - icloud.com
  - me.com
  - aol.com
  - protonmail.com
  - gmx.com
KNOWN_ESP_DOMAINS: []
ESP_DISCOVERY_THRESHOLD: 5
PROTECTED_LABELS:
  - STARRED
  - IMPORTANT
ENABLE_LLM_CLASSIFICATION: false
ANTHROPIC_MODEL: claude-haiku
BATCH_SIZE_CAP: 5000
RESTORE_WINDOW_DAYS: 30
TRANSACTIONAL_LOCAL_PART_PATTERN: order|receipt|invoice|billing|statement|shipping|confirmation
NOTIFICATION_LOCAL_PART_PATTERN: notify|notification|alert|no-?reply|do-?not-?reply|system|updates
